<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haitian Products</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}
header{
    background:#ff6a00;
    color:white;
    padding:15px;
    text-align:center;
}
.search{
    padding:15px;
    text-align:center;
}
.search input{
    width:90%;
    max-width:500px;
    padding:12px;
    border-radius:25px;
    border:1px solid #ccc;
}
.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    padding:15px;
}
.card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}
.card h3{
    padding:10px;
    margin:0;
}
.price{
    color:#ff6a00;
    font-weight:bold;
    padding:0 10px;
}
.btn{
    display:block;
    background:#25D366;
    color:white;
    text-align:center;
    text-decoration:none;
    padding:12px;
    margin:10px;
    border-radius:8px;
}
</style>

</head>

<body>

<header>
<h1>Haitian Products</h1>
</header>

<div class="search">
<input type="text" placeholder="Rechercher un produit...">
</div>

Commander sur WhatsApp

</div>

</div>
