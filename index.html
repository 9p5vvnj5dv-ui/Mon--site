< DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haitian Products</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:#ff6a00;
    color:white;
    padding:15px;
    text-align:center;
}

.search{
    padding:15px;
    text-align:center;
}

.search input{
    width:90%;
    max-width:500px;
    padding:12px;
    border-radius:30px;
    border:1px solid #ccc;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    text-align:center;
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card h3{
    margin:10px 0 5px;
}

.price{
    color:#ff6a00;
    font-size:20px;
    font-weight:bold;
}

.btn{
    display:inline-block;
    margin:15px;
    padding:10px 15px;
    background:#25D366;
    color:white;
    text-decoration:none;
    border-radius:8px;
}
</style>

</head>
<body>

<header>
<h1>Haitian Products</h1>
</header>

<div class="search">
<input type="text" placeholder="Rechercher un produit...">
</div>

<div class="products">

<div class="card">
<img src="parfum.jpg" alt="Aventus Blue For Him">
<h3>Aventus Blue For Him</h3>
<p class="price">1 200 HTG</p>

<a class="btn"
href="https://wa.me/50932429034?text=Bonjour,%20je%20veux%20commander%20le%20parfum%20Aventus%20Blue%20For%20Him.">
Commander sur WhatsApp
</a>

</div>

</div>

</body>
</html>
