<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Haitian Store</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f7f7;
  color: #222;
}

/* EN-TÊTE */

header {
  background: white;
  padding: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.logo {
  color: #f26b21;
  font-size: 26px;
  font-weight: bold;
}

/* RECHERCHE */

.search {
  margin-top: 12px;
  display: flex;
}

.search input {
  flex: 1;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 25px 0 0 25px;
  font-size: 15px;
}

.search button {
  background: #222;
  color: white;
  border: none;
  padding: 0 20px;
  border-radius: 0 25px 25px 0;
}

/* CATÉGORIES */

nav {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

nav button {
  border: none;
  padding: 10px 22px;
  border-radius: 20px;
  background: #eee;
  font-weight: bold;
}

nav button.active {
  background: #f26b21;
  color: white;
}

/* TITRE */

h2 {
  padding: 0 15px;
}

/* PRODUITS */

.products {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 15px;
}

/* PETIT CARRÉ DU PRODUIT */

.product {
  background: white;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 1px 5px rgba(0,0,0,0.12);
  border: 1px solid #eee;
}

/* PHOTO */

.product img {
  width: 100%;
  height: 140px;
  object-fit: contain;
  background: white;
  display: block;
}

/* INFORMATIONS */

.info {
  padding: 8px;
}

.name {
  font-size: 14px;
  font-weight: bold;
  min-height: 34px;
}

/* PRIX */

.price {
  color: #e45117;
  font-size: 17px;
  font-weight: bold;
  margin: 5px 0;
}

/* BOUTON COMMANDER */

.buy {
  width: 100%;
  padding: 9px;
  background: #1687e8;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 2px 5px rgba(22,135,232,0.25);
}

.buy::before {
  content: "✦ ";
}

.buy:hover {
  background: #0d70c7;
}

/* GRAND ÉCRAN */

@media (min-width: 700px) {

  .products {
    grid-template-columns: repeat(4, 1fr);
  }

}

</style>

</head>

<body>

<header>

  <div class="logo">
    Haitian Store
  </div>

  <div class="search">

    <input
      type="text"
      id="search"
      placeholder="Que recherchez-vous ?"
      oninput="afficherProduits()"
    >

    <button>
      🔍
    </button>

  </div>

  <nav>

    <button
      class="active"
      onclick="changerCategorie('all', this)">
      Tous
    </button>

    <button
      onclick="changerCategorie('men', this)">
      Men
    </button>

    <button
      onclick="changerCategorie('women', this)">
      Women
    </button>

  </nav>

</header>


<h2 id="titre">
  Nos produits
</h2>


<div
  class="products"
  id="products">
</div>


<script>

/* PRODUITS */

const produits = [

  {
    nom: "Aventus Blue for Him",
    prix: 1000,
    categorie: "men",
    image: "aventus-bleu.jpg"
  },

  {
    nom: "Spray AXE Black Night",
    prix: 500,
    categorie: "men",
    image: "spray-axe.jpg"
  },

  {
    nom: "Montre Classique Homme",
    prix: 2500,
    categorie: "men",
    image: "https://images.unsplash.com/photo-1523170335258-f5ed11844a49?auto=format&fit=crop&w=700&q=80"
  },

  {
    nom: "Lunettes de soleil Homme",
    prix: 900,
    categorie: "men",
    image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=700&q=80"
  },

  {
    nom: "Sac à main Femme",
    prix: 2200,
    categorie: "women",
    image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=700&q=80"
  },

  {
    nom: "Sac Femme Élégant",
    prix: 2800,
    categorie: "women",
    image: "https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?auto=format&fit=crop&w=700&q=80"
  }

];


let categorieActuelle = "all";


/* CHANGER DE CATÉGORIE */

function changerCategorie(categorie, bouton) {

  categorieActuelle = categorie;

  document
    .querySelectorAll("nav button")
    .forEach(function(b) {
      b.classList.remove("active");
    });

  bouton.classList.add("active");


  if (categorie === "men") {

    document.getElementById("titre").textContent =
      "Produits Men";

  }

  else if (categorie === "women") {

    document.getElementById("titre").textContent =
      "Produits Women";

  }

  else {

    document.getElementById("titre").textContent =
      "Nos produits";

  }


  afficherProduits();

}


/* AFFICHER LES PRODUITS */

function afficherProduits() {

  const recherche =
    document
      .getElementById("search")
      .value
      .toLowerCase();


  const resultat = produits.filter(function(produit) {

    const bonneCategorie =
      categorieActuelle === "all" ||
      produit.categorie === categorieActuelle;


    const bonneRecherche =
      produit.nom
        .toLowerCase()
        .includes(recherche);


    return bonneCategorie && bonneRecherche;

  });


  document.getElementById("products").innerHTML =

    resultat.map(function(produit) {

      return `

        <div class="product">

          <img
            src="${produit.image}"
            alt="${produit.nom}"
          >

          <div class="info">

            <div class="name">
              ${produit.nom}
            </div>

            <div class="price">
              ${produit.prix.toLocaleString("fr-FR")} G
            </div>

            <button
              class="buy"
              onclick="commander('${produit.nom}', ${produit.prix})">

              Commander

            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* COMMANDER SUR WHATSAPP */

function commander(nom, prix) {

  const message =
    "Bonjour Haitian Store, je voudrais commander " +
    nom +
    " au prix de " +
    prix +
    " G.";


  const numero =
    "50932429034";


  window.open(

    "https://wa.me/" +
    numero +
    "?text=" +
    encodeURIComponent(message),

    "_blank"

  );

}


/* AFFICHAGE INITIAL */

afficherProduits();

</script>

</body>
</html>
